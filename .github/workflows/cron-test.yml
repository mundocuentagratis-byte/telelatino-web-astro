name: Cron Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print trigger info
        run: |
          echo "Cron test running"
          echo "event_name=${{ github.event_name }}"
          echo "event_schedule=${{ github.event.schedule }}"
          date -u
